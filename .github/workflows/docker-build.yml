name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      # Runs on the same VPS as CompCare Hub, alongside it — a separate
      # container on its own port (3002) so it doesn't collide with
      # healthark_app (3001). Needs VPS_SSH_KEY added as a repo secret
      # here (same deploy key used by the healthark repo works, since
      # it's the same server) and /opt/mystudytwin/.env already created
      # on the VPS with REDIS_URL and whichever AI provider key you want
      # to use (GEMINI_API_KEY is the free-tier-friendly default the app
      # checks first — see api/chat.ts / server.js for the full list and
      # priority order).
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 163.245.223.58
          port: 22
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/mystudytwin
            touch /opt/mystudytwin/.env
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop mystudytwin_app || true
            docker rm mystudytwin_app || true
            # Resource capped so this side project can't starve CompCare Hub
            # (a real care-home system) of CPU/RAM if it ever spikes.
            docker run -d --name mystudytwin_app --restart always \
              --network host \
              --memory 512m --cpus 1 \
              -e PORT=3002 \
              --env-file /opt/mystudytwin/.env \
              ghcr.io/${{ github.repository }}:latest
            docker image prune -f
            echo "Deploy complete"
